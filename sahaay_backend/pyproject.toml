[project]
name = "sahaay-backend"
version = "0.1.0"
description = "Secure Firebase-authenticated API boundary for SAHAAY."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "firebase-admin>=6.5,<7.0",
  "supabase>=2.10,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
dev-dependencies = ["pytest>=8.3,<9.0"]
